services:
  api:
    build:
      context: .
      target: dev
    env_file:
      - .env
    environment:
      # The container always listens on 8080; the host port is mapped below.
      PORT: 8080
      # Inside the Docker network the API reaches Postgres via the "db" service.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pkm_tracker}?sslmode=disable
    ports:
      - "${PORT:-8081}:8080"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pkm_tracker}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pkm_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  go-mod-cache:
  go-build-cache:
